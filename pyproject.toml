[project]
name = "pochi-verifier"
version = "0.1.2"
description = "A library that runs the Pochi CLI for verification tasks."
readme = "README.md"
authors = [
    { name = "Zhiming Ma", email = "codes.icy@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = [
    "pytest"
]

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = [
    "tests/unit",
]
markers = [
    "integration: marks tests as integration tests (slow, require network)",
]
